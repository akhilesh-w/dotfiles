# Idle behavior. The eye icon in Waybar (idle inhibitor) pauses all of this,
# and so does any app playing video or audio fullscreen (e.g. browsers).
#
#  5 min  dim the screen to 10%  (restored on any input)
# 10 min  lock with hyprlock
# 11 min  turn the display off
# 30 min  suspend

general {
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before sleeping, so the laptop wakes up locked.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 10, 15, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 420, 64
    position = 0, -40
    halign = center
    valign = center

    inner_color = rgba(41, 31, 38, 0.9)
    outer_color = rgba(119, 26, 79, 1.0)
    outline_thickness = 2
    font_color = rgba(211, 207, 207, 1.0)
    check_color = rgba(96, 180, 68, 1.0)
    fail_color = rgba(255, 115, 89, 1.0)

    font_family = FiraCode Nerd Font
    placeholder_text = Password
    fail_text = Wrong password
    rounding = 8
    fade_on_empty = false
    dots_spacing = 0.3
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = FiraCode Nerd Font
    color = rgba(255, 207, 223, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

# Date under the clock, e.g. "Wednesday, 18 November"
label {
    monitor =
    text = cmd[update:60000] date +'%A, %-d %B'
    font_size = 16
    font_family = Adwaita Sans
    color = rgba(222, 214, 219, 0.85)
    position = 0, 50
    halign = center
    valign = center
}

# Battery at the bottom, e.g. "󰂄 63%  charging"
label {
    monitor =
    text = cmd[update:30000] b=/sys/class/power_supply/BAT0; [ -d $b ] || b=$(ls -d /sys/class/power_supply/BAT* | head -1); c=$(cat $b/capacity); s=$(cat $b/status); i=󰁹; [ "$s" = Charging ] && i=󰂄; [ $c -le 20 ] && [ "$s" != Charging ] && i=󰂃; echo "$i  $c%"
    font_size = 13
    font_family = FiraCode Nerd Font
    color = rgba(143, 131, 139, 1.0)
    position = 0, 40
    halign = center
    valign = bottom
}

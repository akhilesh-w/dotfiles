# Same as the hl.env lines in hyprland.lua, for systemd user services
# (hyprpolkitagent, voxtype, portals...), which do not inherit Hyprland's env.
# Keeps ordinary apps from opening the NVIDIA GPU; NVIDIA's libraries would
# otherwise load the driver just to list GPUs and block the Waybar switch.
# The prime-run wrapper in ~/.scripts/bin clears both for apps meant for NVIDIA.
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
VK_DRIVER_FILES=/usr/share/vulkan/icd.d/radeon_icd.json
